# Application stack for ai-dev-factory.
#
# The global Traefik reverse proxy lives in
# ``deploy/infra/docker-compose.traefik.yml`` and is started once per
# host via ``bash deploy/infra/start_traefik.sh``. Sandboxed runs
# (``docker compose -p sandbox-… up -d``) intentionally only see the
# services below, so they never try to bind port 80 themselves.

services:
  api:
    build:
      context: .
      target: runtime
    # Single source of truth shared with the host supervisor — see
    # deploy/.env.example. Containerised paths (AI_DEV_FACTORY_RUNTIME_ROOT,
    # working_dir, the volume mount below) intentionally override the
    # host-side values for the API process.
    env_file:
      - path: deploy/.env
        required: false
    environment:
      # Inside the container the runtime lives at /runtime (the volume mount
      # configured below). The matching HOST_RUNTIME_ROOT in deploy/.env tells
      # the host supervisor where /runtime resolves to on disk.
      - AI_DEV_FACTORY_RUNTIME_ROOT=/runtime
      # RUNTIME_BASE_ROOT (explicit per-project runtime base, required to import/
      # bootstrap NEW projects) is provided via deploy/.env (env_file above), not
      # hardcoded here. It is a HOST path — the supervisor creates
      # {RUNTIME_BASE_ROOT}/<project_id>/ there. It is intentionally NOT derived
      # from AI_DEV_FACTORY_RUNTIME_ROOT.parent (which would resolve to '/').
      # See deploy/.env.example: RUNTIME_BASE_ROOT=/Users/<you>/runtime
      # Tell the API it runs inside Docker — daemon_manager.start() will then
      # refuse to spawn the daemon locally (no gh, no .git, no claude inside
      # the container) and either delegate to AI_DEV_FACTORY_HOST_DAEMON_COMMAND
      # or return the host launch command to the dashboard for copy/paste.
      - AI_DEV_FACTORY_API_IN_DOCKER=1
      # Optional: set this to a shell command (typically an ssh wrapper) that
      # actually starts the daemon on the host. Without it, the dashboard's
      # Start button surfaces the suggested command for manual host launch.
      # - AI_DEV_FACTORY_HOST_DAEMON_COMMAND=ssh host -- 'cd ~/runtime/ai-dev-factory/clones/ai-dev-factory && source .venv/bin/activate && python tools/agent_runner/run_daemon.py --exec-cmd "claude --dangerously-skip-permissions" --poll-issues --issue-repo <owner>/<repo> --auto-commit --auto-push --auto-include-code --interval 30'
      # Supervisor URL: defaults to the value defined in deploy/.env
      # (host.docker.internal:${AI_DEV_FACTORY_SUPERVISOR_PORT}). Falls back
      # to the documented default when .env is absent so a fresh checkout
      # still boots without configuration.
      - AI_DEV_FACTORY_SUPERVISOR_URL=${AI_DEV_FACTORY_SUPERVISOR_URL:-http://host.docker.internal:8090}
      # Sandbox root inside the container — matches the bind-mount below.
      # Scripts and workers resolve sandboxes at this container-side path.
      - SANDBOX_ROOT=/sandboxes
      - CONTAINER_SANDBOX_ROOT=/sandboxes
      # PROJECT_NAME is provided via deploy/.env (env_file) — not overridden here
      # so the value in deploy/.env takes effect inside the container.
      #
      # Runtime store backend. SQLite (default) stores a file under /runtime,
      # which corrupts when shared across the container/host over a macOS
      # bind-mount. Set RUNTIME_DB_BACKEND=postgres (in deploy/.env) to use the
      # networked Postgres service below instead — no file locking, one DB per
      # project. Inside the container Postgres is reached at host "db"; the host
      # supervisor reaches it at 127.0.0.1 (deploy/.env). RUNTIME_DB_BACKEND and
      # credentials come from deploy/.env so both halves of the stack agree.
      - RUNTIME_DB_HOST=db
    volumes:
      # Mount the same host runtime root that deploy/.env's HOST_RUNTIME_ROOT
      # refers to. Using ${HOST_RUNTIME_ROOT} ensures the supervisor's path
      # mapping rules and the actual bind-mount agree.
      - ${HOST_RUNTIME_ROOT:-~/runtime/ai-dev-factory}:/runtime
      # Mount the sandbox root so container-side code can read/write sandbox
      # state at the new location (outside the main runtime hierarchy).
      - ${HOST_SANDBOX_ROOT:-~/sandboxes}:/sandboxes
      - ~/.ssh:/root/.ssh:ro
      - ~/.gitconfig:/root/.gitconfig:ro
    working_dir: /app
    command: sh -c "/app/deploy/bootstrap.sh && python -m uvicorn services.control_api.main:app --host 0.0.0.0 --port 8080"
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      default:
      ai-dev-factory-runtime:
        aliases:
          - sandbox-${SANDBOX_ID:-default}-api

  # Networked runtime store. Replaces the corruption-prone SQLite-on-bind-mount
  # setup: a single Postgres server holds one database per project (created at
  # bootstrap). Reached as "db" inside the Docker network and on
  # 127.0.0.1:${RUNTIME_DB_PORT} from the host (supervisor/daemon).
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${RUNTIME_DB_USER:-adf}
      - POSTGRES_PASSWORD=${RUNTIME_DB_PASSWORD:-adf}
      # Maintenance/bootstrap database; per-project databases are created on demand.
      - POSTGRES_DB=${RUNTIME_DB_NAME:-adf}
    volumes:
      # Named volume (lives inside the Docker VM, NOT a macOS bind-mount) so
      # Postgres file locking is reliable and the data survives recreation.
      - adf-db-data:/var/lib/postgresql/data
    ports:
      - "${RUNTIME_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RUNTIME_DB_USER:-adf} -d ${RUNTIME_DB_NAME:-adf}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      default:

  web:
    build:
      context: .
      target: web
    ports:
      - "${WEB_PORT:-3000}:80"
    restart: unless-stopped
    depends_on:
      - api
    networks:
      default:
      ai-dev-factory-runtime:
        aliases:
          - sandbox-${SANDBOX_ID:-default}-web

volumes:
  adf-db-data:

networks:
  ai-dev-factory-runtime:
    external: true

