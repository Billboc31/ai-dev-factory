services:
  api:
    build:
      context: .
      target: runtime
    env_file:
      - path: deploy/.env
        required: false
    environment:
      - AI_DEV_FACTORY_RUNTIME_ROOT=/runtime
    volumes:
      - ~/runtime/ai-dev-factory:/runtime
      - ~/.ssh:/root/.ssh:ro
      - ~/.gitconfig:/root/.gitconfig:ro
    working_dir: /app
    command: >
      sh -c "
        /app/deploy/bootstrap.sh &&
        python -m uvicorn services.control_api.main:app
          --host 0.0.0.0
          --port 8080
      "
    ports:
      - "8080:8080"
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
    ports:
      - "3000:80"
    restart: unless-stopped
    depends_on:
      - api

