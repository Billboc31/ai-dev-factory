version: 1
project: ai-dev-factory
required_tools:
  - git
  - docker
  - gh
  - claude
components:
  - name: api
    type: docker
    service: api
  - name: web
    type: docker
    service: web
  - name: supervisor
    type: host
    command: bash deploy/start_supervisor.sh
  - name: daemon
    type: host
    command: python tools/agent_runner/run_daemon.py --exec-cmd "claude --dangerously-skip-permissions" --poll-issues --issue-repo Billboc31/ai-dev-factory --auto-commit --auto-push --auto-include-code --interval 30
healthcheck:
  command: curl -sf http://localhost:8080/health
  timeout: 30
  retries: 3
  delay: 5
