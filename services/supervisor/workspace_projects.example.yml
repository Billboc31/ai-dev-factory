# workspace_projects.example.yml
# Full annotated schema for AI Dev Factory workspace project configuration.
# Copy to workspace_projects.yml and adapt for your environment.
# This file is never loaded automatically; it is documentation only.
#
# Point the supervisor at your config:
#   WORKSPACE_PROJECTS_CONFIG=/path/to/workspace_projects.yml

projects:
  # Project key — must match the project_id used in the Workspace chat.
  timizer:
    display_name: "Timizer"          # Optional. Shown in the confirmation card.
    repository_path: /projects/timizer   # Absolute path to the git repo on the host.
    default_branch: main             # Only this branch may be pulled; mismatch = FAILED.
    allow_dirty: false               # false → fail if uncommitted changes exist at execution time.
    redeploy:
      backend:
        service: backend             # Docker Compose service name for the backend.
      frontend:
        service: frontend            # Docker Compose service name for the frontend.
    preview_url: http://localhost:3000   # Optional. Returned on successful deployment.

    # T229 — one-click project deploy block (optional).
    # When present, the "Deploy project" button appears in the AI Workspace panel.
    # When absent, the panel shows a "no deployment configuration" banner.
    deploy:
      type: docker-compose           # Only supported value. Required.
      compose_file: docker-compose.yml   # Relative to repository_path. Must stay within the repo root.
      preview_url: http://localhost:3000  # URL shown on success. Optional.
      healthcheck_url: http://localhost:3000/health  # Polled until 2xx or timeout. Optional.
      healthcheck_timeout_s: 60      # How long to wait for the healthcheck. Default: 60.
      healthcheck_interval_s: 5      # Poll interval for the healthcheck. Default: 5.
      allow_dirty: false             # false → reject if the working tree is dirty. Default: false.
      startup_wait_s: 2              # Seconds to wait after build before healthcheck. Default: 2.

  # Minimal example — backend only, no preview URL.
  my-api:
    repository_path: /home/dev/my-api
    default_branch: main
    allow_dirty: false
    redeploy:
      backend:
        service: api

  # Minimal deploy-only example — no redeploy block needed.
  my-simple-app:
    repository_path: /home/dev/my-simple-app
    default_branch: main
    allow_dirty: false
    deploy:
      type: docker-compose
      compose_file: docker-compose.yml
      preview_url: http://localhost:8080
